name: Build preview

on:
  pull_request:
    branches: [main]

env:
  SITE_URL: https://docs.bifrost.origo.is
  BASE_URL: /

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Public-site boundary (no message types, internals or removed pages)
        run: npm run check:ip-boundary

      - name: Links between pages
        run: npm run check:links

      - name: Agreed structure (menu, setup for the company and for each user, a page per role)
        run: npm run check:structure

      - name: Build both locales
        run: npm run build

      # The artifact is the review copy: download it, unzip, open index.html.
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-site-${{ github.event.pull_request.number }}
          path: build
          retention-days: 14
