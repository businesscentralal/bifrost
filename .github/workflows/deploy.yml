name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# SITE_URL and BASE_URL are the only two things that decide where the site is
# rooted. Switching to the custom domain is a two-line change here plus the DNS
# record and the Pages setting — see README.md.
env:
  SITE_URL: https://businesscentralal.github.io
  BASE_URL: /bifrost/

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deployment: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Docusaurus reads the git history to show a last-updated date per page.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build both locales
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
